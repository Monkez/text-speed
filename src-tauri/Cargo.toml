[package]
name = "app"
version = "0.1.0"
description = "TextSpeed AI Smart Typist"
authors = ["TextSpeed"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
arboard = "3.6.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
rdev = { path = "./rdev_fork" }
chrono = "0.4.44"
winapi = { version = "0.3.9", features = ["libloaderapi", "winuser"] }
